# PRODUCCIÓN. Para desarrollo usa docker-compose.dev.yml (localhost:3002 + API en localhost:8000).
#
# Toda la configuración sale del archivo .env de esta carpeta (plantilla: .env.example, sección
# PRODUCCIÓN). Aquí no hay ningún dominio ni "localhost" fijo. Guía completa: docs/PRODUCCION.md
#
#   docker compose build          # compila el frontend con REACT_APP_* del .env
#   docker compose up -d
# Requiere Docker Compose v2 (`docker compose`, con espacio): usa `name:` y `profiles`.
#
# Entrada única: el contenedor "frontend" (nginx) sirve la web, /api, /admin, /static y /media.
# Solo escucha en 127.0.0.1 del servidor: delante tiene que ir Caddy o nginx con HTTPS.
# Base de datos, Redis y gunicorn NO publican puertos: solo se ven dentro de la red de Docker.

# Nombre de proyecto propio: volúmenes e imágenes no se mezclan con los de docker-compose.dev.yml
name: coffe-saas-prod

# Rotación de los logs de Docker: sin límite, el log de cada contenedor crece hasta llenar el disco
# (gunicorn escribe una línea por petición). Máximo 5 archivos de 10 MB por contenedor.
# Verlos: docker compose logs -f --tail 200 web frontend
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-django-env: &django-env
  DEBUG: ${DEBUG:-False}
  SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en el .env (ver docs/PRODUCCION.md)}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Falta ALLOWED_HOSTS en el .env, p. ej. cafe.midominio.com}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Falta CSRF_TRUSTED_ORIGINS en el .env, p. ej. https://cafe.midominio.com}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # Proxy del servidor (HTTPS) + nginx del frontend = 2 proxies delante de Django
  NUM_PROXIES: ${NUM_PROXIES:-2}
  USE_X_FORWARDED_PROTO: ${USE_X_FORWARDED_PROTO:-True}
  USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST:-True}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}
  COMENSAL_COOKIE_SECURE: ${COMENSAL_COOKIE_SECURE:-True}
  DB_ENGINE: "django.db.backends.postgresql"
  DB_NAME: ${DB_NAME:-coffe_saas}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
  DB_HOST: "db"
  DB_PORT: "5432"
  REDIS_URL: "redis://redis:6379/0"
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: coffe_saas_db
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-coffe_saas}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (límites anti-abuso compartidos entre los workers de gunicorn)
  redis:
    image: redis:7-alpine
    container_name: coffe_saas_redis
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django App (gunicorn). Aplica migraciones y collectstatic en cada arranque.
  web:
    build: .
    container_name: coffe_saas_web
    logging: *logging
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --access-logfile -"
    environment:
      <<: *django-env
      # Workers de gunicorn (regla habitual: 2 x núcleos + 1)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # React Frontend + nginx: única puerta de entrada (web, /api, /admin, /static, /media)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # CRA incrusta estas variables en el build: si cambian, `docker compose build frontend`
      args:
        # Vacío = el API está en el mismo dominio (/api/v1). Solo se llena si el API va en otro subdominio.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        # Dominio definitivo que se imprime en los QR de las mesas (vacío = el dominio desde el que se abre el panel)
        REACT_APP_PUBLIC_URL: ${REACT_APP_PUBLIC_URL:-}
    container_name: coffe_saas_frontend
    logging: *logging
    restart: unless-stopped
    ports:
      # Solo accesible desde el propio servidor: el proxy con HTTPS (Caddy/nginx) apunta aquí
      - "127.0.0.1:${FRONTEND_PORT:-8088}:3000"
    volumes:
      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro
    depends_on:
      - web

  # Celery Worker: aún no hay tareas en segundo plano (no existe config/celery.py).
  # Se activa con: docker compose --profile celery up -d
  celery:
    build: .
    container_name: coffe_saas_celery
    logging: *logging
    restart: unless-stopped
    profiles: ["celery"]
    command: celery -A config worker -l info
    environment:
      <<: *django-env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  # pgAdmin (opcional). Se activa con: docker compose --profile herramientas up -d pgadmin
  # Escucha solo en 127.0.0.1: úsalo con un túnel SSH (ssh -L 5050:127.0.0.1:5050 usuario@servidor).
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: coffe_saas_pgadmin
    logging: *logging
    profiles: ["herramientas"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  static_volume:
  media_volume:
