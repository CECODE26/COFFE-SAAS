version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: coffe_saas_db_dev
    environment:
      POSTGRES_DB: coffe_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: coffe_saas_redis_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django App (Development)
  web:
    build: .
    container_name: coffe_saas_web_dev
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-dev-key"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "coffe_saas"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_HOST: "db"
      DB_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000"
    volumes:
      - .:/app
      - /app/.git
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # React Frontend (Development - Hot Reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: coffe_saas_frontend_dev
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: "http://localhost:8000/api/v1"
      REACT_APP_ENV: "development"
      WDS_SOCKET_HOST: localhost
      WDS_SOCKET_PORT: 3000
      WDS_SOCKET_PATH: /ws
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    depends_on:
      - web
    networks:
      - coffe_saas_network

  # pgAdmin para gestionar BD
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: coffe_saas_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@coffe.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  coffe_saas_network:
    driver: bridge
