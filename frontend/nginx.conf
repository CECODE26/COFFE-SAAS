# nginx del contenedor "frontend" en producción: es la puerta de entrada de la app en un solo dominio.
#   /                        -> la web de React (build)
#   /api/  y  /admin/        -> Django (gunicorn en el servicio "web")
#   /static/js|css|media/    -> archivos del build de React
#   /static/ (el resto)      -> estáticos de Django: admin, DRF (collectstatic, volumen static_volume)
#   /media/                  -> fotos subidas por los locales (volumen media_volume)
# Delante va el proxy del servidor (Caddy / nginx) que pone el HTTPS: ver docs/PRODUCCION.md.

# Esquema original (https) que manda el proxy del servidor; si no hay proxy delante, el de esta conexión.
# Sin esto Django creería que todo llega por http y las URLs de las fotos saldrían con http://.
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# IP del visitante para el límite de intentos: el ÚLTIMO valor de X-Forwarded-For es el que puso el proxy
# con HTTPS del servidor (Caddy/nginx) y el visitante no lo puede falsificar. Sin proxy delante: la IP de la conexión.
map $http_x_forwarded_for $ip_visitante {
    "~(?<ultima_ip>[^,\s]+)\s*$" $ultima_ip;
    default                      $remote_addr;
}
# Solo cuentan los POST (enviar el formulario); abrir la página del admin no gasta intentos.
map $request_method $ip_si_post {
    POST    $ip_visitante;
    default "";
}
# Anti fuerza bruta en login y registro: 10 intentos por minuto por IP (más una ráfaga de 10).
limit_req_zone $ip_si_post zone=login:10m rate=10r/m;

server {
    listen 3000;
    server_tokens off;

    # Las fotos de la carta pueden pesar hasta 5 MB
    client_max_body_size 10m;

    root /usr/share/nginx/html;

    # Django (gunicorn en el servicio "web"). Se resuelve con el DNS interno de Docker en cada petición
    # (no solo al arrancar): si el contenedor "web" se recrea con otra IP, nginx no se queda con la vieja (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://web:8000;

    # Cabeceras que recibe Django (las heredan los bloques que hacen proxy_pass)
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $esquema_original;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # index.html no se cachea: así un despliegue nuevo se ve al recargar
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Archivos del build de React con hash en el nombre: se pueden cachear un año.
    # (Prefijos más largos que /static/, así nginx los elige antes que los estáticos de Django.)
    location ^~ /static/js/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /static/css/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /static/media/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Estáticos de Django (admin, DRF)
    location ^~ /static/ {
        alias /srv/static/;
        expires 7d;
    }

    # Fotos subidas por los locales
    location ^~ /media/ {
        alias /srv/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff";
    }

    # Login y registro del panel, y login del admin de Django: con límite de intentos por IP.
    # (Va antes que el bloque general de /api: nginx usa la primera expresión regular que coincide.)
    location ~ ^/(api/v1/auth/(login|register)|admin/login)/$ {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @demasiados_intentos;
        proxy_pass $django;
    }
    location @demasiados_intentos {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail": "Demasiados intentos. Espera un minuto y vuelve a intentarlo."}';
    }

    # API y admin de Django
    location ~ ^/(api|admin)/ {
        proxy_pass $django;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
